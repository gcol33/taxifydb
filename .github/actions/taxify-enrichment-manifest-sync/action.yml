name: 'taxify runtime enrichment manifest sync'
description: >
  Open a PR on the taxify runtime repo recording a freshly published enrichment
  release in inst/manifest.json. Mirrors taxify-manifest-sync for the rolling
  enrichment-<version> tag: mechanical fields are written by
  taxifydb::update_enrichment_manifest(), curated fields (trait_cols, citation,
  static, species_col) are merged and preserved. Fails loudly when the token is
  missing or no longer works, so a lapsed secret cannot drift the manifest
  behind a green build.

inputs:
  enrichment:
    description: 'Enrichment name, also the .vtr basename.'
    required: true
  version:
    description: 'Rolling enrichment release version (the enrichment-<version> tag).'
    required: true
  token:
    description: >
      PAT with contents:write and pull-requests:write on the runtime repo.
      Empty fails the step -- this sync is required, not optional.
    required: true
  runtime_repo:
    description: 'owner/repo of the taxify runtime.'
    required: false
    default: 'gcol33/taxify'
  rscript:
    description: 'Rscript executable.'
    required: false
    default: 'Rscript'

runs:
  using: composite
  steps:
    - name: Sync the runtime enrichment manifest
      shell: bash
      env:
        TAXIFY_MANIFEST_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        ENR="${{ inputs.enrichment }}"
        VER="${{ inputs.version }}"
        REPO="${{ inputs.runtime_repo }}"

        # The sync is required: without it $REPO keeps advertising the previous
        # enrichment release while taxifydb serves the new one, leaving the two
        # manifests drifted (issue #20). The .vtr and the taxifydb manifest are
        # both committed before this step runs, so failing costs no artifact.
        if [ -z "${TAXIFY_MANIFEST_TOKEN:-}" ]; then
          echo "::error title=taxify enrichment manifest not synced::TAXIFY_MANIFEST_TOKEN is unset, so $ENR (enrichment-$VER) is published but $REPO still points at the previous release. Set the secret and re-run this step, or update inst/manifest.json by hand."
          exit 1
        fi

        # Probe write access before doing any work. $REPO is public, so an
        # expired or revoked PAT still clones anonymously and only trips much
        # later on push, as a raw git auth error naming neither the secret nor
        # the fix. Asking the API settles it up front.
        if ! PERM=$(gh api "repos/${REPO}" --jq '.permissions.push' 2>&1); then
          printf '%s\n' "$PERM"
          echo "::error title=taxify enrichment manifest not synced::TAXIFY_MANIFEST_TOKEN cannot read $REPO; it is most likely expired or revoked. $ENR is already published, so refresh the secret and re-run this step only."
          exit 1
        fi
        if [ "$PERM" != "true" ]; then
          echo "::error title=taxify enrichment manifest not synced::TAXIFY_MANIFEST_TOKEN reaches $REPO but has no write access (permissions.push=$PERM), so it cannot push the sync branch. Grant contents:write and pull-requests:write, then re-run this step."
          exit 1
        fi

        # update_enrichment_manifest() reads meta.json next to the .vtr for the
        # version, nrow, content_id, source_* and license.
        VTR="$(pwd)/output/enrichment/$ENR/$ENR.vtr"
        if [ ! -f "$VTR" ]; then
          echo "::error title=taxify enrichment manifest not synced::built .vtr not found at $VTR; the build step must run before the sync."
          exit 1
        fi

        rm -rf taxify_repo
        git clone "https://x-access-token:${TAXIFY_MANIFEST_TOKEN}@github.com/${REPO}.git" taxify_repo
        cd taxify_repo

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        BR="auto/enrichment-manifest-$ENR"
        git checkout -B "$BR" origin/main

        "${{ inputs.rscript }}" -e "taxifydb::update_enrichment_manifest('inst/manifest.json', '$ENR', '$VTR', release_version = '$VER', runtime = TRUE)"

        git add inst/manifest.json
        if git diff --staged --quiet; then
          echo "$REPO manifest already current for $ENR (enrichment-$VER)."
          exit 0
        fi

        git commit -m "manifest: sync enrichment $ENR from taxifydb enrichment-$VER release"
        git push -f -u origin "$BR"

        # An existing PR for this branch is the one tolerable failure here: the
        # push above already refreshed it. Any other failure leaves the branch
        # pushed with nothing to merge, so it has to surface.
        if ! PR_OUT=$(gh pr create --repo "$REPO" --base main --head "$BR" \
              --title "manifest: sync enrichment $ENR (enrichment-$VER)" \
              --body "Automated enrichment-manifest sync from the taxifydb \`enrichment-$VER\` release. Written by \`taxifydb::update_enrichment_manifest(runtime = TRUE)\`: mechanical fields (latest, source_version, full_url, nrow, content_id, source_url, license, available_groups) are always refreshed; runtime fields (trait_cols, species_col, citation, static, source_format) are populated from the build for a new entry and preserved for an existing one. No manual curation needed." \
              2>&1); then
          if printf '%s' "$PR_OUT" | grep -qi "already exists"; then
            echo "PR for $BR already open; branch updated."
          else
            printf '%s\n' "$PR_OUT"
            echo "::error title=taxify enrichment manifest not synced::Pushed $BR to $REPO but could not open the PR; TAXIFY_MANIFEST_TOKEN most likely lacks pull-requests:write. $ENR stays unsynced until that PR exists."
            exit 1
          fi
        else
          printf '%s\n' "$PR_OUT"
        fi
