name: Build Heavy Backbones

on:
  schedule:
    # 1st of January and July at 04:00 UTC (after light builds)
    - cron: '0 4 1 1,7 *'
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - wfo
          - col
          - gbif
          - euromed
          - fungorum
          - algaebase
          - wcvp
          - lcvp

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        backend: ${{ github.event.inputs.backend == 'all' && fromJSON('["wfo", "col", "gbif", "euromed", "fungorum", "algaebase", "wcvp", "lcvp"]') || fromJSON(format('["{0}"]', github.event.inputs.backend || 'col')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Rscript
        id: rscript
        run: |
          echo "path=$(ls -d "/c/Program Files/R/R-"*/bin/Rscript.exe | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install taxifydb (local)
        run: |
          "${{ steps.rscript.outputs.path }}" -e "devtools::install_local('.', upgrade = 'never')"
        shell: bash

      - name: Compute version
        id: version
        run: echo "version=$(date +%Y.%m)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build backbone
        run: |
          "${{ steps.rscript.outputs.path }}" -e "taxifydb::build_backend('${{ matrix.backend }}', output_dir = file.path('output', '${{ matrix.backend }}'))"
        shell: bash

      - name: Create delta vs previous release
        id: delta
        continue-on-error: true
        uses: ./.github/actions/vtr-delta
        with:
          backend: ${{ matrix.backend }}
          version: ${{ steps.version.outputs.version }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          rscript: ${{ steps.rscript.outputs.path }}

      - name: Create release and upload
        run: |
          TAG="${{ matrix.backend }}-${{ steps.version.outputs.version }}"

          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "$(echo ${{ matrix.backend }} | tr '[:lower:]' '[:upper:]') v${{ steps.version.outputs.version }}" \
            --notes "${{ matrix.backend }} backbone v${{ steps.version.outputs.version }}"

          for f in output/${{ matrix.backend }}/${{ matrix.backend }}.vtr \
                   output/${{ matrix.backend }}/${{ matrix.backend }}.xdelta \
                   output/${{ matrix.backend }}/${{ matrix.backend }}.meta; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --repo ${{ github.repository }} --clobber
            fi
          done
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update and commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 10); do
            # Re-apply this backend's manifest entry on top of the latest remote,
            # so jobs pinned to the trigger SHA never clobber each other.
            git fetch origin main
            git reset --hard origin/main
            "${{ steps.rscript.outputs.path }}" -e "p <- file.path('output','${{ matrix.backend }}','${{ matrix.backend }}.xdelta'); d <- '${{ steps.delta.outputs.prev_version }}'; taxifydb::update_manifest('manifest/manifest.json', '${{ matrix.backend }}', '${{ steps.version.outputs.version }}', file.path('output','${{ matrix.backend }}','${{ matrix.backend }}.vtr'), delta_path = if (file.exists(p)) p else NULL, delta_from = if (nzchar(d)) d else NULL)"
            git add manifest/manifest.json
            if git diff --staged --quiet; then
              echo "manifest unchanged"; break
            fi
            git commit -m "Update manifest: ${{ matrix.backend }} v${{ steps.version.outputs.version }}"
            if git push origin HEAD:main; then
              echo "manifest pushed"; break
            fi
            echo "push raced (attempt $i); retrying on latest main"
            sleep $((RANDOM % 6 + 2))
          done
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync taxify runtime manifest (PR)
        run: |
          if [ -z "$TAXIFY_MANIFEST_TOKEN" ]; then
            echo "::error::TAXIFY_MANIFEST_TOKEN is not set; taxify's manifest was not synced."
            echo "The backbone release above succeeded, but taxify still points at the previous version." >&2
            echo "Mint a fine-grained PAT on gcol33/taxify (Contents: read/write, Pull requests: read/write)," >&2
            echo "then: gh secret set TAXIFY_MANIFEST_TOKEN --repo gcol33/taxifydb" >&2
            exit 1
          fi
          BE="${{ matrix.backend }}"
          VER="${{ steps.version.outputs.version }}"
          VTR="$(pwd)/output/$BE/$BE.vtr"
          DELTA="$(pwd)/output/$BE/$BE.xdelta"
          rm -rf taxify_repo
          git clone "https://x-access-token:${TAXIFY_MANIFEST_TOKEN}@github.com/gcol33/taxify.git" taxify_repo
          cd taxify_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="auto/manifest-$BE"
          git checkout -B "$BR" origin/main
          "${{ steps.rscript.outputs.path }}" -e "p <- '$DELTA'; d <- '${{ steps.delta.outputs.prev_version }}'; taxifydb::update_manifest('inst/manifest.json', '$BE', '$VER', '$VTR', delta_path = if (file.exists(p)) p else NULL, delta_from = if (nzchar(d)) d else NULL)"
          git add inst/manifest.json
          if git diff --staged --quiet; then
            echo "taxify manifest already current for $BE."; exit 0
          fi
          git commit -m "manifest: sync $BE v$VER from taxifydb release"
          git push -f -u origin "$BR"
          if [ "$(gh pr list --repo gcol33/taxify --head "$BR" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "PR for $BR already open (branch updated)."
          else
            gh pr create --repo gcol33/taxify --base main --head "$BR" \
              --title "manifest: sync $BE v$VER" \
              --body "Automated backend-manifest sync from the taxifydb \`$BE-$VER\` release. Mechanical fields (full_url, full_size, full_sha256, content_id, nrow, delta_url, source_url) are written by \`taxifydb::update_manifest()\`; curated fields (citation, license) are preserved from the existing entry. A brand-new backend needs its citation/license added once in this PR."
          fi
        shell: bash
        env:
          TAXIFY_MANIFEST_TOKEN: ${{ secrets.TAXIFY_MANIFEST_TOKEN }}
          GH_TOKEN: ${{ secrets.TAXIFY_MANIFEST_TOKEN }}
