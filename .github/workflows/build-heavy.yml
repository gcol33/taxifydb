name: Build Heavy Backbones

# This workflow targets `self-hosted`, and no self-hosted runner is registered
# on the repository. COL, COL XR and GBIF are built locally instead (see
# scripts/launch_backbone.ps1) and published by hand; every run recorded here
# has been cancelled or left queued. Registering a runner is what would make it
# live -- until then a schedule only queues a job nothing can pick up, so both
# crons are held below rather than firing monthly into an empty pool.
on:
  # schedule:
  #   # 1st of January and July at 04:00 UTC (after light builds)
  #   - cron: '0 4 1 1,7 *'
  #   # COL XR alone, on the 20th of each month. The Extended Release is
  #   # published monthly against the Base Release's annual cycle, so building it
  #   # only twice a year would leave it as stale as the sources it exists to
  #   # improve on. The 20th clears the mid-month COL release date.
  #   - cron: '0 4 20 * *'
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - col
          - colxr
          - gbif

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Only the two backbones above everything build-light is known to
        # clear, plus COL XR which is COL-sized. The other six moved to
        # build-light, where they run on a hosted runner that exists.
        backend: >-
          ${{ github.event.schedule == '0 4 20 * *'
              && fromJSON('["colxr"]')
              || (github.event.inputs.backend == 'all'
                  && fromJSON('["col", "colxr", "gbif"]')
                  || fromJSON(format('["{0}"]', github.event.inputs.backend || 'col'))) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Rscript
        id: rscript
        run: |
          echo "path=$(ls -d "/c/Program Files/R/R-"*/bin/Rscript.exe | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install taxifydb (local)
        run: |
          "${{ steps.rscript.outputs.path }}" -e "devtools::install_local('.', upgrade = 'never')"
        shell: bash

      - name: Compute version
        id: version
        run: echo "version=$(date +%Y.%m)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build backbone
        run: |
          "${{ steps.rscript.outputs.path }}" -e "taxifydb::build_backend('${{ matrix.backend }}', output_dir = file.path('output', '${{ matrix.backend }}'))"
        shell: bash

      - name: Create delta vs previous release
        id: delta
        continue-on-error: true
        uses: ./.github/actions/vtr-delta
        with:
          backend: ${{ matrix.backend }}
          version: ${{ steps.version.outputs.version }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          rscript: ${{ steps.rscript.outputs.path }}

      - name: Create release and upload
        run: |
          TAG="${{ matrix.backend }}-${{ steps.version.outputs.version }}"

          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "$(echo ${{ matrix.backend }} | tr '[:lower:]' '[:upper:]') v${{ steps.version.outputs.version }}" \
            --notes "${{ matrix.backend }} backbone v${{ steps.version.outputs.version }}"

          # The glob picks up any sidecar the build wrote beside the backbone
          # (COL and WoRMS both publish a species profile). Left out, a sidecar
          # stays pinned to whichever release last carried it while its
          # backbone moves on -- WoRMS ran three versions apart that way.
          for f in output/${{ matrix.backend }}/${{ matrix.backend }}.vtr \
                   output/${{ matrix.backend }}/${{ matrix.backend }}.xdelta \
                   output/${{ matrix.backend }}/${{ matrix.backend }}.meta \
                   output/${{ matrix.backend }}/${{ matrix.backend }}_*.vtr; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --repo ${{ github.repository }} --clobber
            fi
          done
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update and commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 10); do
            # Re-apply this backend's manifest entry on top of the latest remote,
            # so jobs pinned to the trigger SHA never clobber each other.
            git fetch origin main
            git reset --hard origin/main
            "${{ steps.rscript.outputs.path }}" scripts/update_manifest_entry.R \
              manifest/manifest.json \
              "${{ matrix.backend }}" \
              "${{ steps.version.outputs.version }}" \
              "output/${{ matrix.backend }}" \
              "${{ steps.delta.outputs.prev_version }}"
            git add manifest/manifest.json
            if git diff --staged --quiet; then
              echo "manifest unchanged"; break
            fi
            git commit -m "Update manifest: ${{ matrix.backend }} v${{ steps.version.outputs.version }}"
            if git push origin HEAD:main; then
              echo "manifest pushed"; break
            fi
            echo "push raced (attempt $i); retrying on latest main"
            sleep $((RANDOM % 6 + 2))
          done
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync taxify runtime manifest (PR)
        uses: ./.github/actions/taxify-manifest-sync
        with:
          backend: ${{ matrix.backend }}
          version: ${{ steps.version.outputs.version }}
          delta_from: ${{ steps.delta.outputs.prev_version }}
          token: ${{ secrets.TAXIFY_MANIFEST_TOKEN }}
          rscript: ${{ steps.rscript.outputs.path }}
