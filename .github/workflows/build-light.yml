name: Build Light Backbones

on:
  schedule:
    # 1st of January and July at 02:00 UTC
    - cron: '0 2 1 1,7 *'
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend to build (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - itis
          - ncbi
          - ott
          - worms
          - fishbase
          - sealifebase
          - reptiledb

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    strategy:
      fail-fast: false
      matrix:
        backend: ${{ github.event.inputs.backend == 'all' && fromJSON('["itis", "ncbi", "ott", "worms", "fishbase", "sealifebase", "reptiledb"]') || fromJSON(format('["{0}"]', github.event.inputs.backend || 'itis')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonlite, any::curl, any::digest, any::DBI, any::RSQLite, any::rfishbase, any::openxlsx2, local::.
          cache-version: 1

      - name: Install xdelta3
        run: sudo apt-get install -y xdelta3

      - name: Download previous release (for delta)
        continue-on-error: true
        run: |
          PREV_TAG=$(gh release list --repo ${{ github.repository }} --limit 50 | grep "^${{ matrix.backend }}-" | head -1 | awk '{print $1}')
          if [ -n "$PREV_TAG" ]; then
            mkdir -p output/${{ matrix.backend }}_prev
            gh release download "$PREV_TAG" \
              --repo ${{ github.repository }} \
              --pattern "${{ matrix.backend }}.vtr" \
              --dir output/${{ matrix.backend }}_prev || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backbone
        run: |
          taxifydb::build_backend(
            "${{ matrix.backend }}",
            output_dir = file.path("output", "${{ matrix.backend }}")
          )
        shell: Rscript {0}

      - name: Compute version
        id: version
        run: echo "version=$(date +%Y.%m)" >> $GITHUB_OUTPUT

      - name: Create delta vs previous
        continue-on-error: true
        run: |
          prev <- file.path("output", "${{ matrix.backend }}_prev",
                             "${{ matrix.backend }}.vtr")
          new  <- file.path("output", "${{ matrix.backend }}",
                             "${{ matrix.backend }}.vtr")
          delta <- file.path("output", "${{ matrix.backend }}",
                              "${{ matrix.backend }}.xdelta")
          if (file.exists(prev) && file.exists(new)) {
            taxifydb::create_delta(prev, new, delta)
          }
        shell: Rscript {0}

      - name: Create release
        run: |
          TAG="${{ matrix.backend }}-${{ steps.version.outputs.version }}"
          NOTES="${{ matrix.backend }} backbone v${{ steps.version.outputs.version }}"

          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "$(echo ${{ matrix.backend }} | tr '[:lower:]' '[:upper:]') v${{ steps.version.outputs.version }}" \
            --notes "$NOTES"

          for f in output/${{ matrix.backend }}/${{ matrix.backend }}.vtr \
                   output/${{ matrix.backend }}/${{ matrix.backend }}.xdelta \
                   output/${{ matrix.backend }}/${{ matrix.backend }}.meta; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --repo ${{ github.repository }} --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update and commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 10); do
            # Re-apply this backend's manifest entry on top of the latest remote,
            # so parallel matrix jobs never clobber each other's updates.
            git fetch origin main
            git reset --hard origin/main
            Rscript -e "p <- file.path('output','${{ matrix.backend }}','${{ matrix.backend }}.xdelta'); taxifydb::update_manifest('manifest/manifest.json', '${{ matrix.backend }}', '${{ steps.version.outputs.version }}', file.path('output','${{ matrix.backend }}','${{ matrix.backend }}.vtr'), delta_path = if (file.exists(p)) p else NULL)"
            git add manifest/manifest.json
            if git diff --staged --quiet; then
              echo "manifest unchanged"; break
            fi
            git commit -m "Update manifest: ${{ matrix.backend }} v${{ steps.version.outputs.version }}"
            if git push origin HEAD:main; then
              echo "manifest pushed"; break
            fi
            echo "push raced (attempt $i); retrying on latest main"
            sleep $((RANDOM % 6 + 2))
          done
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync taxify runtime manifest (PR)
        continue-on-error: true
        run: |
          if [ -z "$TAXIFY_MANIFEST_TOKEN" ]; then
            echo "TAXIFY_MANIFEST_TOKEN not set; skipping taxify manifest sync."
            exit 0
          fi
          BE="${{ matrix.backend }}"
          VER="${{ steps.version.outputs.version }}"
          VTR="$(pwd)/output/$BE/$BE.vtr"
          DELTA="$(pwd)/output/$BE/$BE.xdelta"
          rm -rf taxify_repo
          git clone "https://x-access-token:${TAXIFY_MANIFEST_TOKEN}@github.com/gcol33/taxify.git" taxify_repo
          cd taxify_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="auto/manifest-$BE"
          git checkout -B "$BR" origin/main
          Rscript -e "p <- '$DELTA'; taxifydb::update_manifest('inst/manifest.json', '$BE', '$VER', '$VTR', delta_path = if (file.exists(p)) p else NULL)"
          git add inst/manifest.json
          if git diff --staged --quiet; then
            echo "taxify manifest already current for $BE."; exit 0
          fi
          git commit -m "manifest: sync $BE v$VER from taxifydb release"
          git push -f -u origin "$BR"
          gh pr create --repo gcol33/taxify --base main --head "$BR" \
            --title "manifest: sync $BE v$VER" \
            --body "Automated backend-manifest sync from the taxifydb \`$BE-$VER\` release. Mechanical fields (full_url, full_size, full_sha256, content_id, nrow, delta_url, source_url) are written by \`taxifydb::update_manifest()\`; curated fields (citation, license) are preserved from the existing entry. A brand-new backend needs its citation/license added once in this PR." \
            2>/dev/null || echo "PR for $BR already open (branch updated)."
        shell: bash
        env:
          TAXIFY_MANIFEST_TOKEN: ${{ secrets.TAXIFY_MANIFEST_TOKEN }}
          GH_TOKEN: ${{ secrets.TAXIFY_MANIFEST_TOKEN }}
