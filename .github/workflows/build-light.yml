name: Build Light Backbones

on:
  schedule:
    # 1st of January and July at 02:00 UTC
    - cron: '0 2 1 1,7 *'
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend to build (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - itis
          - ncbi
          - ott
          - worms
          - fishbase
          - sealifebase
          - reptiledb
          - wfo
          - wcvp
          - lcvp
          - fungorum
          - algaebase
          - euromed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    strategy:
      fail-fast: false
      matrix:
        # Which workflow a backbone belongs to is decided by size, measured
        # against what already builds here: OTT (3.7M rows) and NCBI (2.8M) are
        # the ceiling this runner is known to clear. WFO, WCVP, LCVP, Fungorum,
        # AlgaeBase and Euro+Med all sit below both and were only ever in
        # build-heavy by assumption; Euro+Med is 147k rows, 4% of OTT. GBIF
        # (6.4M) and COL (5.3M) are the two genuinely above the set, and they
        # stay in build-heavy along with COL XR.
        backend: ${{ github.event.inputs.backend == 'all' && fromJSON('["itis", "ncbi", "ott", "worms", "fishbase", "sealifebase", "reptiledb", "wfo", "wcvp", "lcvp", "fungorum", "algaebase", "euromed"]') || fromJSON(format('["{0}"]', github.event.inputs.backend || 'itis')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # data.table is a Suggests of the package but a requirement of these
          # builds: the streaming feed parses every block with fread(), and the
          # WoRMS taxon core cannot be read any other way (#43).
          extra-packages: any::jsonlite, any::curl, any::digest, any::data.table, any::DBI, any::RSQLite, any::rfishbase, any::openxlsx2, local::.
          cache-version: 1

      - name: Install xdelta3
        run: sudo apt-get install -y xdelta3

      - name: Compute version
        id: version
        run: echo "version=$(date +%Y.%m)" >> $GITHUB_OUTPUT

      - name: Build backbone
        run: |
          taxifydb::build_backend(
            "${{ matrix.backend }}",
            output_dir = file.path("output", "${{ matrix.backend }}")
          )
        shell: Rscript {0}

      - name: Create delta vs previous release
        id: delta
        continue-on-error: true
        uses: ./.github/actions/vtr-delta
        with:
          backend: ${{ matrix.backend }}
          version: ${{ steps.version.outputs.version }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          TAG="${{ matrix.backend }}-${{ steps.version.outputs.version }}"
          NOTES="${{ matrix.backend }} backbone v${{ steps.version.outputs.version }}"

          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "$(echo ${{ matrix.backend }} | tr '[:lower:]' '[:upper:]') v${{ steps.version.outputs.version }}" \
            --notes "$NOTES"

          # The glob picks up any sidecar the build wrote beside the backbone
          # (COL and WoRMS both publish a species profile). Left out, a sidecar
          # stays pinned to whichever release last carried it while its
          # backbone moves on -- WoRMS ran three versions apart that way.
          for f in output/${{ matrix.backend }}/${{ matrix.backend }}.vtr \
                   output/${{ matrix.backend }}/${{ matrix.backend }}.xdelta \
                   output/${{ matrix.backend }}/${{ matrix.backend }}.meta \
                   output/${{ matrix.backend }}/${{ matrix.backend }}_*.vtr; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --repo ${{ github.repository }} --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update and commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 10); do
            # Re-apply this backend's manifest entry on top of the latest remote,
            # so parallel matrix jobs never clobber each other's updates.
            git fetch origin main
            git reset --hard origin/main
            Rscript scripts/update_manifest_entry.R \
              manifest/manifest.json \
              "${{ matrix.backend }}" \
              "${{ steps.version.outputs.version }}" \
              "output/${{ matrix.backend }}" \
              "${{ steps.delta.outputs.prev_version }}"
            git add manifest/manifest.json
            if git diff --staged --quiet; then
              echo "manifest unchanged"; break
            fi
            git commit -m "Update manifest: ${{ matrix.backend }} v${{ steps.version.outputs.version }}"
            if git push origin HEAD:main; then
              echo "manifest pushed"; break
            fi
            echo "push raced (attempt $i); retrying on latest main"
            sleep $((RANDOM % 6 + 2))
          done
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync taxify runtime manifest (PR)
        uses: ./.github/actions/taxify-manifest-sync
        with:
          backend: ${{ matrix.backend }}
          version: ${{ steps.version.outputs.version }}
          delta_from: ${{ steps.delta.outputs.prev_version }}
          token: ${{ secrets.TAXIFY_MANIFEST_TOKEN }}
