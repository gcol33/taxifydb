name: Build Light Backbones

on:
  schedule:
    # 1st of January and July at 02:00 UTC
    - cron: '0 2 1 1,7 *'
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend to build (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - itis
          - ncbi
          - ott
          - worms
          - fishbase
          - sealifebase
          - reptiledb
          - wfo
          - wcvp
          - lcvp
          - fungorum
          - algaebase
          - euromed
          - mdd
          - avilist
          - lpsn
          - wgsrpd
          - meow

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    strategy:
      fail-fast: false
      matrix:
        # Which workflow a backbone belongs to is decided by size, measured
        # against what already builds here: OTT (3.7M rows) and NCBI (2.8M) are
        # the ceiling this runner is known to clear. WFO, WCVP, LCVP, Fungorum,
        # AlgaeBase and Euro+Med all sit below both and were only ever in
        # build-heavy by assumption; Euro+Med is 147k rows, 4% of OTT. GBIF
        # (6.4M) and COL (5.3M) are the two genuinely above the set, and they
        # stay in build-heavy along with COL XR. MDD (62k), AviList (41k) and
        # LPSN (45k) are the smallest of the set and had a builder but no
        # workflow, so until now they could only be cut by hand.
        #
        # wgsrpd and meow are reference geometry rather than backbones (polygon
        # vertices, no names), but they publish, version and byte-gate exactly
        # like one, so they build here too. Both read a frozen GeoJSON snapshot,
        # so a run over unchanged input stops at the byte gate and cuts nothing.
        backend: ${{ github.event.inputs.backend == 'all' && fromJSON('["itis", "ncbi", "ott", "worms", "fishbase", "sealifebase", "reptiledb", "wfo", "wcvp", "lcvp", "fungorum", "algaebase", "euromed", "mdd", "avilist", "lpsn", "wgsrpd", "meow"]') || fromJSON(format('["{0}"]', github.event.inputs.backend || 'itis')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # data.table is a Suggests of the package but a requirement of these
          # builds: the streaming feed parses every block with fread(), and the
          # WoRMS taxon core cannot be read any other way (#43).
          extra-packages: any::jsonlite, any::curl, any::digest, any::data.table, any::DBI, any::RSQLite, any::rfishbase, any::openxlsx2, local::.
          cache-version: 1

      - name: Install xdelta3
        run: sudo apt-get install -y xdelta3

      - name: Build backbone
        run: |
          taxifydb::build_backend(
            "${{ matrix.backend }}",
            output_dir = file.path("output", "${{ matrix.backend }}")
          )
        shell: Rscript {0}

      # The release is named for the source release the build read, which the
      # build recorded in its .meta, never for the month the job ran: this
      # value is the tag, the manifest's `latest` and what taxify_lock() stamps.
      - name: Read version
        id: version
        run: |
          echo "version=$(Rscript scripts/backbone_version.R \
            "${{ matrix.backend }}" "output/${{ matrix.backend }}")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Did the data change?
        id: changed
        run: |
          echo "value=$(Rscript scripts/vtr_changed.R \
            manifest/manifest.json \
            "${{ matrix.backend }}" \
            "output/${{ matrix.backend }}/${{ matrix.backend }}.vtr")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create delta vs previous release
        id: delta
        if: steps.changed.outputs.value == 'true'
        continue-on-error: true
        uses: ./.github/actions/vtr-delta
        with:
          backend: ${{ matrix.backend }}
          version: ${{ steps.version.outputs.version }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # publish_release() uploads the .vtr, the patch, the .meta and every
      # <backend>_*.vtr sidecar the build wrote (COL and WoRMS both publish a
      # species profile; left out, a sidecar stays pinned to whichever release
      # last carried it while its backbone moves on), plus the content-addressed
      # <backend>-<content_id>.vtr copy the manifest records as content_url. A
      # tag already cut for this source release is reused, never deleted:
      # deleting it would take the earlier cut's content-addressed copy with it.
      - name: Publish release
        if: steps.changed.outputs.value == 'true'
        run: |
          Rscript scripts/publish_backbone_release.R \
            "${{ matrix.backend }}" \
            "output/${{ matrix.backend }}" \
            "${{ github.repository }}"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update and commit manifest
        if: steps.changed.outputs.value == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 10); do
            # Re-apply this backend's manifest entry on top of the latest remote,
            # so parallel matrix jobs never clobber each other's updates.
            git fetch origin main
            git reset --hard origin/main
            Rscript scripts/update_manifest_entry.R \
              manifest/manifest.json \
              "${{ matrix.backend }}" \
              "output/${{ matrix.backend }}" \
              "${{ steps.delta.outputs.prev_version }}"
            git add manifest/manifest.json
            if git diff --staged --quiet; then
              echo "manifest unchanged"; break
            fi
            git commit -m "Update manifest: ${{ matrix.backend }} v${{ steps.version.outputs.version }}"
            if git push origin HEAD:main; then
              echo "manifest pushed"; break
            fi
            echo "push raced (attempt $i); retrying on latest main"
            sleep $((RANDOM % 6 + 2))
          done
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync taxify runtime manifest (PR)
        if: steps.changed.outputs.value == 'true'
        uses: ./.github/actions/taxify-manifest-sync
        with:
          backend: ${{ matrix.backend }}
          version: ${{ steps.version.outputs.version }}
          delta_from: ${{ steps.delta.outputs.prev_version }}
          token: ${{ secrets.TAXIFY_MANIFEST_TOKEN }}

      - name: No release (data unchanged)
        if: steps.changed.outputs.value != 'true'
        run: |
          echo "::notice title=${{ matrix.backend }}::Built .vtr is identical to the published asset; no release cut."
