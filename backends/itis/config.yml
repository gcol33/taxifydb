backend: itis
name: "Integrated Taxonomic Information System"

source:
  url: "https://www.itis.gov/downloads/itisSqlite.zip"
  format: sqlite
  size_mb: 212

version:
  # ITIS updates continuously; we stamp with YYYY.MM of build date
  pattern: "{year}.{month}"

schema:
  # SQLite table -> canonical column mappings
  main_table: taxonomic_units
  col_map:
    taxon_id: tsn
    canonical_name: complete_name
    taxon_rank: rank_name           # from taxon_unit_types via rank_id join
    taxonomic_status: name_usage    # valid, invalid, accepted, not accepted
    accepted_name_usage_id: null    # derived from synonym_links table
    family: null                    # derived from parent_tsn hierarchy walk
    genus: null                     # derived from parent_tsn hierarchy walk
    specific_epithet: null          # parsed from unit_name2
    authorship: taxon_author        # from taxon_authors_lkp via taxon_author_id
    infraspecific_epithet: null     # parsed from unit_name3/unit_name4

  # ITIS-specific: synonym link table
  synonym_table: synonym_links
  synonym_cols:
    tsn: tsn
    tsn_accepted: tsn_accepted

  # Rank lookup table
  rank_table: taxon_unit_types
  rank_cols:
    rank_id: rank_id
    rank_name: rank_name
    kingdom_id: kingdom_id

notes: |
  ITIS stores taxonomy as a parent-child tree via parent_tsn.
  Family and genus must be resolved by walking up the tree.
  Synonym relationships are in a separate synonym_links table
  (not via taxonomicStatus + acceptedNameUsageID like DwC).
  The name_usage field uses: valid, invalid, accepted, not accepted.
  We map: valid/accepted -> ACCEPTED, invalid/not accepted -> SYNONYM.
